name: CI

# Run on every push and pull request to any branch.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code onto the runner.
      - name: Check out code
        uses: actions/checkout@v4

      # Install Python. We pin 3.12 to match the Docker image.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the project's dependencies plus pytest.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # Run the test suite.
      - name: Run tests
        run: pytest -v